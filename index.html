<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  body {
    background: #1a1a1a;
    color: #eee;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 40px;
  }
  canvas {
    background: #000;
    border: 2px solid #444;
  }
  #score {
    font-size: 20px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div id="score">Score: 0</div>
<canvas id="board" width="400" height="400"></canvas>

<script>
const CELL = 20;
const COLS = 20;
const ROWS = 20;
const SPEED = 150;

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

let snake, direction, turns, food, score, dead, won;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  direction = {x: 1, y: 0};
  turns = [];
  score = 0;
  dead = false;
  won = false;
  placeFood();
  scoreEl.textContent = 'Score: 0';
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  if (dead || won) return;

  // Apply at most one queued turn per tick, so the snake actually performs a
  // turn before the next one is allowed.
  if (turns.length) direction = turns.shift();

  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    dead = true;
    draw();
    return;
  }

  const eating = head.x === food.x && head.y === food.y;

  // The tail square is vacated on this same tick, so moving into it is legal —
  // unless we are eating, because then the tail stays put and the snake grows.
  const body = eating ? snake : snake.slice(0, -1);

  if (body.some(s => s.x === head.x && s.y === head.y)) {
    dead = true;
    draw();
    return;
  }

  snake.unshift(head);

  if (eating) {
    score++;
    scoreEl.textContent = 'Score: ' + score;

    // Filling the board is a win. Asking placeFood() for an empty square here
    // would spin forever, because there isn't one.
    if (snake.length === COLS * ROWS) {
      won = true;
      draw();
      return;
    }

    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#e44';
  ctx.fillRect(food.x * CELL, food.y * CELL, CELL, CELL);

  ctx.fillStyle = '#4c4';
  for (const s of snake) {
    ctx.fillRect(s.x * CELL, s.y * CELL, CELL, CELL);
  }

  if (dead || won) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = won ? '#4c4' : '#fff';
    ctx.font = '32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(won ? 'You win!' : 'Game Over', canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.fillText('press R to restart', canvas.width / 2, canvas.height / 2 + 20);
  }
}

const KEYS = {
  ArrowUp:    {x:  0, y: -1},
  ArrowDown:  {x:  0, y:  1},
  ArrowLeft:  {x: -1, y:  0},
  ArrowRight: {x:  1, y:  0}
};

function queueTurn(next) {
  // Validate against the last turn already queued, not against the direction
  // the snake is currently drawn facing — otherwise two quick presses can
  // stack into a reversal.
  const last = turns.length ? turns[turns.length - 1] : direction;
  if (next.x === -last.x && next.y === -last.y) return;  // reversal
  if (next.x === last.x && next.y === last.y) return;    // no change
  if (turns.length < 2) turns.push(next);
}

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') {
    reset();
    draw();
    return;
  }
  if (KEYS[e.key]) {
    e.preventDefault();
    queueTurn(KEYS[e.key]);
  }
});

reset();
draw();
setInterval(step, SPEED);
</script>

</body>
</html>
