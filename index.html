<!DOCTYPE html>
<html lang="en">
<head>

<title>Snake</title>

<body>

<div id="score">Score: 0</div>
<canvas id="board" width="400" height="400"></canvas>

<!--
  Plain <script src> tags, not ES modules, and the order matters: each file
  uses what the ones above it define. Modules would be tidier, but they are
  fetched under CORS rules and a page opened straight from disk has a null
  origin, so the browser refuses to load them. Classic scripts are exempt,
  which is what keeps this working by double-clicking index.html.
-->
<script src="js/config.js"></script>
<script src="js/geometry.js"></script>
<script src="js/snake.js"></script>
<script src="js/board.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>

</body>
</html>
